name: Build and Push Docker Image (FULL)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build_full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Initial disk usage:"
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract version if tag
        id: get_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare FULL tags
        id: tags
        shell: bash
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/melotts"
          TAGS="${IMAGE}:latest"
          if [[ -n "${{ steps.get_version.outputs.version }}" ]]; then
            TAGS+=$'\n'"${IMAGE}:${{ steps.get_version.outputs.version }}_full"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata args
        id: build_meta
        shell: bash
        run: |
          BUILD_ID="${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"

      - name: Build and push FULL image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_ID=${{ steps.build_meta.outputs.build_id }}
            INIT_DOWNLOADS_PROFILE=FULL

      - name: Check remaining disk space
        run: df -h

